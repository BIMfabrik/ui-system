name: Design protocol checks

on:
  push:
    paths:
      - 'scripts/designctl.py'
      - 'scripts/export_unity_package.py'
      - 'unity/**'
      - 'tests/test_unity_package.py'
      - 'design/**'
      - 'styles/tokens.css'
      - 'tests/test_designctl.py'
      - '.github/workflows/design-token-check.yml'
  pull_request:
    paths:
      - 'scripts/designctl.py'
      - 'scripts/export_unity_package.py'
      - 'unity/**'
      - 'tests/test_unity_package.py'
      - 'design/**'
      - 'styles/tokens.css'
      - 'tests/test_designctl.py'
      - '.github/workflows/design-token-check.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/export_unity_package.py --check
      - run: python3 -m compileall -q scripts/designctl.py scripts/export_unity_package.py
