name: Notify enrolled UI-system consumers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing immutable release tag to distribute'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UI_SYNC_TOKEN }}
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Check dispatch readiness
        id: ready
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'UI_SYNC_TOKEN not configured; no cross-repository dispatch performed.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Notify only enrolled repositories
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/ui-consumers.txt
          import json
          import re
          from pathlib import Path
          data = json.loads(Path('design/consumers.json').read_text())
          for repo in data['enabledRepositories']:
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
                  raise SystemExit('Invalid enrolled repository')
              print(repo)
          PY
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            echo "Dispatching UI design release $RELEASE_REF to $repo"
            gh api --method POST "repos/$repo/dispatches" \
              -f event_type=ui-system-release \
              -f "client_payload[ref]=$RELEASE_REF"
          done < /tmp/ui-consumers.txt
          echo 'Dispatched to enrolled repositories only.'
